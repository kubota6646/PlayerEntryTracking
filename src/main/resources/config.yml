# PlayerEntryTracking プラグイン設定ファイル
# このファイルでメッセージをカスタマイズできます

# メッセージ設定
# 使用可能なプレースホルダー:
#   {player} - プレイヤー名
#   {server} - サーバー名（移動メッセージのみ）
# カラーコード: &0-9, &a-f, &r (リセット), &l (太字), &m (取り消し線), &n (下線), &o (斜体)
messages:
  # プレイヤーが参加した時のメッセージ
  join: "&e{player}さんが参加しました"
  
  # プレイヤーがサーバー間を移動した時のメッセージ
  switch: "&e{player}さんが{server}サーバーへ移動しました"
  
  # プレイヤーが退出した時のメッセージ
  quit: "&e{player}さんが退出しました"

# 通知の有効/無効設定
notifications:
  # 参加通知を表示するかどうか
  join: true
  
  # サーバー移動通知を表示するかどうか
  switch: true
  
  # 退出通知を表示するかどうか
  quit: true
